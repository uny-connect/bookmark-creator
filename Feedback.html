<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #f4f5f7; font-family: 'Pretendard', 'Noto Sans JP', sans-serif; margin: 0; padding: 0 !important; color: #333;}
    .container { max-width: 380px; padding: 40px 20px; margin: auto; text-align: center; }
    .card { border-radius: 18px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.02); background: #fff; padding: 24px 20px; margin-top: 5px; }
    
    .btn-custom { border-radius: 14px; padding: 14px; font-weight: 700; width: 100%; transition: all 0.2s; font-size: 14px; background-color: #1A2B49; color: #fff; border: none; display: block; text-align: center; text-decoration: none; }
    .btn-custom:active { transform: scale(0.97); }
    textarea.form-control { border-radius: 12px; border: 1.5px solid #eceef1; padding: 14px; font-size: 13.5px; background: #fafbfc; width: 100%; resize: none; }
    textarea.form-control:focus { border-color: #1A2B49; box-shadow: 0 0 0 4px rgba(26,43,73,0.15); background: #fff; outline: none; }
    
    .badge-partner { font-size: 10px; letter-spacing: 0.8px; padding: 5px 10px; border-radius: 6px; background-color: #1A2B49 !important; color: #fff; display: inline-block; font-weight: 700; }
    .brand-title { color: #1A2B49; font-weight: 700; margin-top: 10px; margin-bottom: 20px; font-size: 22px; letter-spacing: -0.5px; }
    .form-title { color: #1A2B49; font-weight: 700; font-size: 15px; margin-top: 0; margin-bottom: 16px; display: block; text-align: center; }
    
    .desc-text { 
      color: #495057; 
      font-size: 12.5px; 
      line-height: 1.6; 
      margin: 0; 
      margin-bottom: 20px;
      font-weight: 500; 
      text-align: center; 
      word-break: break-all; 
      overflow-wrap: break-word; 
      padding: 0 4px; 
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div style="margin-bottom: 10px; margin-top: 10px;">
      <span class="badge-partner">PARTNER CENTER</span>
    </div>
    <h2 class="brand-title">BOOKMARK CREATOR</h2>
    
    <div class="card" id="formCard">
      <span class="form-title">🔄 日時変更リクエスト</span>
      <p class="desc-text">
        ご希望の日時、クリエイターに送る<br>メッセージを記入してください。
      </p>
      
      <textarea id="feedbackMsg" class="form-control mb-4" rows="4" placeholder="例) 16:00なら予約可能です。"></textarea>
      <button class="btn-custom" onclick="submitFeedback()">リクエストを送信する</button>
    </div>

    <div id="successCard" class="card" style="display:none;">
      <span class="form-title" style="color: #2D6A4F;">✅ 送信完了</span>
      <p class="desc-text" style="text-align: center; margin-bottom: 20px;">
        リクエストが正常に送信されました。<br>
        担当者が確認後、対応いたします。
      </p>
      
      <div style="margin-top: 24px; padding: 14px; background-color: #f8f9fa; border-radius: 12px; border: 1px dashed #cfd4da; color: #495057; font-size: 13px; font-weight: 700; text-align: center;">
        このままページを閉じてください。
      </div>
    </div>
  </div>

  <script>
    function submitFeedback() {
      var msg = document.getElementById('feedbackMsg').value.trim();
      if(!msg) return alert('メッセージを入力してください。');
      
      var btn = document.querySelector('.btn-custom');
      btn.disabled = true; 
      btn.innerText = '送信中...';
      
      google.script.run
        .withSuccessHandler(function(res) {
          if(res.success) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
          } else {
            alert('エラーが発生しました: ' + res.error); 
            btn.disabled = false; 
            btn.innerText = 'リクエストを送信する';
          }
        })
        .storeDirectFeedback(<?= row ?>, '<?= orderNo ?>', msg);
    }
  </script>
</body>
</html>
