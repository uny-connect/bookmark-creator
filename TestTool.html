<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --brand-navy: #1A2B49; }
    body { background: #f4f5f7; font-family: 'Pretendard', 'Noto Sans JP', sans-serif; color: #333; margin: 0; padding: 0; }
    .container { max-width: 440px; padding: 40px 20px; margin: auto; }
    .card { border-radius: 20px; border: none; box-shadow: 0 8px 30px rgba(0,0,0,0.04); background: #ffffff; padding: 28px 24px; }
    .badge-brand { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #ffffff; background: var(--brand-navy); padding: 5px 12px; border-radius: 6px; display: inline-block; }
    .title { color: var(--brand-navy); font-weight: 900; margin-top: 12px; margin-bottom: 20px; font-size: 20px; letter-spacing: -0.5px; }
    .form-label { font-size: 13px; font-weight: 700; color: #495057; margin-bottom: 6px; }
    .form-control { border-radius: 12px; border: 1.5px solid #eceef1; padding: 14px; font-size: 14px; background: #fafbfc; }
    .form-control:focus { border-color: var(--brand-navy); box-shadow: 0 0 0 4px rgba(26,43,73,0.12); background: #fff; }
    .btn-submit { background-color: var(--brand-navy); color: #ffffff; border-radius: 14px; padding: 15px; font-size: 14.5px; font-weight: 700; border: none; width: 100%; transition: all 0.2s; }
    .btn-submit:disabled { background-color: #adb5bd; }
    .store-badge-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 12px; padding: 14px; margin-bottom: 18px; font-size: 13.5px; }
    .step-desc { font-size: 12.5px; color: #6c757d; line-height: 1.5; margin-bottom: 20px; }

    /* 커스텀 알림 모달 스펙 통일 */
    .modal-dialog { margin: 0 auto !important; }
    .modal-content { border-radius: 20px !important; border: none !important; box-shadow: 0 10px 40px rgba(0,0,0,0.15) !important; max-width: 320px; margin: auto; }
  </style>
</head>
<body>
  <div class="container text-center">
    <div><span class="badge-brand">PARTNER ONBOARDING</span></div>
    <h3 class="title">店舗メール登録・受信テスト</h3>
    <p class="step-desc">
      予約通知を受信するメールアドレスを登録し、<br>
      テストメールが正常に届くか確認します。
    </p>

    <div class="card text-start">
      <div class="mb-3">
        <label class="form-label">店舗コード</label>
        <div class="input-group">
          <input type="text" id="storeIdInput" class="form-control text-uppercase fw-bold" placeholder="例:BOOKMARK-0001" value="<?= initialStoreId ?>" onkeyup="if(event.key==='Enter'){searchStore()}">
          <button class="btn btn-outline-secondary" type="button" id="searchBtn" onclick="searchStore()" style="border-radius: 0 12px 12px 0; font-size: 13px; font-weight: 700;">確認</button>
        </div>
      </div>

      <div id="step2Area" style="display: none;">
        <div class="store-badge-box">
          <p class="m-0 mb-1"><strong>店舗名:</strong> <span id="storeNameText" style="color: var(--brand-navy); font-weight: 700;"></span></p>
          <p class="m-0 text-muted" style="font-size: 12px;">※ 対象店舗が一致しているかご確認ください。</p>
        </div>

        <div class="mb-4">
          <label class="form-label">通知先メールアドレス</label>
          <input type="email" id="emailInput" class="form-control" placeholder="example@gmail.com" onkeyup="if(event.key==='Enter'){registerAndSendTest()}">
          <div class="form-text" style="font-size: 11.5px; color: #8b95a1;">※ 既存のアドレスがある場合は上書き保存されます。</div>
        </div>

        <button type="button" id="saveAndSendBtn" class="btn-submit" onclick="registerAndSendTest()">登録してテスト送信</button>
      </div>
    </div>
  </div>

  <!-- 🎯 통일된 커스텀 알림 모달 -->
<!-- 변경 후 (상단 18vh 여백 적용) -->
<div class="modal fade" id="customAlert" tabindex="-1" style="z-index: 1060;">
  <div class="modal-dialog" style="margin-top: 18vh !important;">
    <div class="modal-content">
        <div class="modal-body text-center" style="padding: 24px;">
          <p class="fw-bold" id="alertMessage" style="font-size: 14.5px; color: var(--brand-navy); word-break: keep-all; line-height: 1.6; margin: 0 0 20px 0;"></p>
          <button type="button" class="btn w-100" data-bs-dismiss="modal" style="border-radius: 14px; padding: 12px; font-weight: 700; background-color: var(--brand-navy); color: #fff; margin: 0;">確認</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentStore = null;
    let alertModalObj = null;

    function showAlert(msg) {
      const safeMsg = String(msg || "エラーが発生しました。");
      document.getElementById('alertMessage').innerHTML = safeMsg.replace(/\n/g, '<br>');
      if (!alertModalObj) {
        alertModalObj = new bootstrap.Modal(document.getElementById('customAlert'));
      }
      alertModalObj.show();
    }

    window.onload = function() {
      alertModalObj = new bootstrap.Modal(document.getElementById('customAlert'));
      const initId = document.getElementById('storeIdInput').value.trim();
      if (initId) searchStore();
    };

    function searchStore() {
      const id = document.getElementById('storeIdInput').value.trim().toUpperCase();
      if (!id) return showAlert('店舗コードを入力してください。');

      const searchBtn = document.getElementById('searchBtn');
      searchBtn.disabled = true;
      searchBtn.innerText = '確認中...';

      google.script.run
        .withSuccessHandler(function(res) {
          searchBtn.disabled = false;
          searchBtn.innerText = '確認';
          if (res.success) {
            currentStore = res.data;
            document.getElementById('storeNameText').innerText = currentStore.nameJp || currentStore.nameKo;
            document.getElementById('emailInput').value = currentStore.email || '';
            document.getElementById('step2Area').style.display = 'block';
          } else {
            showAlert(res.error);
            document.getElementById('step2Area').style.display = 'none';
            currentStore = null;
          }
        })
        .withFailureHandler(function(err) {
          searchBtn.disabled = false;
          searchBtn.innerText = '確認';
          showAlert('通信エラー: ' + err.message);
        })
        .findStoreSimple(id);
    }

    function registerAndSendTest() {
      if (!currentStore) return;
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) return showAlert('有効なメールアドレスを入力してください。');

      const btn = document.getElementById('saveAndSendBtn');
      btn.disabled = true;
      btn.innerText = '登録＆送信中...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = '登録してテスト送信';
          if (res.success) {
            showAlert('✅ <b>登録およびテスト送信が完了しました！</b><br>メール受信トレイをご確認ください。<br><br><span style="font-size: 12.5px; color: #6c757d;"></span>');
          } else {
            showAlert('❌ <b>処理失敗</b><br>' + res.error);
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = '登録してテスト送信';
          showAlert('通信エラー: ' + err.message);
        })
        .saveStoreEmailAndSendTest(currentStore.storeId, email);
    }
  </script>
</body>
</html>
